# Status: Proposed
# Phase 2 deployment sketch for a single host. The API and web application
# images do not exist yet — this file starts PostgreSQL only.
# It has not been executed as part of discovery. Do not add secrets here.
# Copy .env.example to .env (git-ignored) before running docker compose.

name: expense-tracker

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
