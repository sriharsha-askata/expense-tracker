name: Feature
description: Propose a product or engineering change. PM owns product priority; DEV owns technical approach.
title: "feat: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Do not include real financial records or secrets. Product changes go through the PM–DEV discussion protocol before implementation.
  - type: textarea
    id: problem
    attributes:
      label: User problem
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: User story
      description: As a … I want … so that …
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Proposed priority
      options:
        - MVP
        - P1
        - P2
        - Future
        - Unset
    validations:
      required: true
  - type: textarea
    id: technical
    attributes:
      label: Technical notes
      description: Data, API, security, or migration impact. Leave blank if not yet reviewed by DEV.
    validations:
      required: false
  - type: textarea
    id: out_of_scope
    attributes:
      label: Explicitly out of scope
    validations:
      required: false
