name: Bug
description: Report a defect. Do not include real financial records, passwords, or secrets.
title: "bug: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Leave out real amounts, notes, emails, statements, screenshots of real ledgers, and credentials. Use synthetic examples.
  - type: textarea
    id: summary
    attributes:
      label: What went wrong
      description: What you saw, and what you expected.
    validations:
      required: true
  - type: input
    id: story
    attributes:
      label: Related story or acceptance criterion
      description: For example TXN-3 or AC-TXN-3.3. Leave blank if unknown.
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use synthetic data only.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Transactions
        - Categories
        - Dashboard
        - Budgets
        - Reports and export
        - Auth and privacy
        - AI assistant
        - Operations
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Environment
      description: Local or deployed, browser, and commit SHA. No session cookies.
    validations:
      required: false
